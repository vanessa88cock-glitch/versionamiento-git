<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio PARKLY</title>
    <link rel="stylesheet" href="css/index.css">
</head>
<body>

<div class="contenedor">

    <!-- ENCABEZADO -->
    <div class="encabezado">
        <img src="img/imgParkLyLogo.jpg" class="logo" alt="Logo PARKLY">
        <div class="titulo-empresa">
            <h1>Parqueadero PARKLY</h1>
            <h2>EMPLEADOS</h2>
            <h3 class="nombre-destacado">BIENVENIDO</h3>
        </div>
    </div>

    <!-- FORMULARIO -->
    <div class="formulario">
        </div>

        <div class="fila">
            <label>Nombre:</label>
            <input type="text">

            <label>Ciudad:</label>
            <select>
                <option>Bogotá</option>
                <option>Medellín</option>
                <option>Cali</option>
            </select>
        </div>

        <div class="fila">
            <label>Apellido:</label>
            <input type="text">

            <label>Cargo:</label>
            <select>
                <option>ADMINISTRADOR</option>
                <option>AUXILIAR</option>
            </select>
        </div>

        <div class="fila">
            <label>Documento:</label>
            <input type="text">

            <label>Teléfono:</label>
            <input type="text">
        </div>

        <div class="fila">
            <label>Contraseña:</label>
            <input type="password">
        </div>

        <!-- BOTONES -->
        <div class="botones">
            <button>&laquo;</button>
            <button>&lsaquo;</button>
            <button>&rsaquo;</button>
            <button>&raquo;</button>
            <button>💾</button>
        </div>
<!-- BOTÓN PARA IR AL HOME -->
<div class="boton-home">
    <a href="home.html" class="btn-home">Ir al Home</a>
    </div>

</div>

</body>
</html>
