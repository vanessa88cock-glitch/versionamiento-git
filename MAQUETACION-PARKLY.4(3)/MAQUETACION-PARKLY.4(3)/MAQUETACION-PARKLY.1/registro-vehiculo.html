<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Formulario Vehículo</title>
<style>
  /* Degradado azul a morado */
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #1e3c72, #6a11cb);
    color: white;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    background: rgba(0,0,0,0.3);
    padding: 10px 20px;
    display: flex;
    justify-content: flex-end;
    align-items: center;
    position: relative;
  }

  /* Reloj horizontal */
  #clock {
    font-weight: bold;
    font-size: 1.2rem;
    letter-spacing: 2px;
    border-left: 2px solid white;
    padding-left: 10px;
    height: 50px;
    display: flex;
    align-items: center;
  }

  main {
    flex: 1;
    display: flex;
    padding: 20px;
    gap: 20px;
  }

  /* Formulario lado izquierdo */
  form {
    background: rgba(255,255,255,0.15);
    padding: 20px;
    border-radius: 10px;
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 15px;
    min-width: 300px;
  }

  form label {
    font-weight: bold;
  }

  form input, form select {
    padding: 6px 10px;
    border-radius: 5px;
    border: none;
    outline: none;
    font-size: 1rem;
  }

  /* Contenedor derecho */
  #rightSide {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  /* Foto del vehículo */
  #vehiclePhoto {
    background: rgba(255,255,255,0.15);
    border-radius: 10px;
    height: 200px;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
  }

  #vehiclePhoto span {
    opacity: 0.7;
  }

  /* Recibo */
  #receipt {
    background: rgba(255,255,255,0.15);
    border-radius: 10px;
    padding: 15px;
    height: 300px;
    overflow-y: auto;
    white-space: pre-wrap;
    font-family: monospace;
    color: #e0e0e0;
  }

  /* Botón imprimir */
  #printBtn {
    margin-top: 10px;
    padding: 10px;
    background: #6a11cb;
    border: none;
    border-radius: 8px;
    color: white;
    font-weight: bold;
    cursor: pointer;
    transition: background-color 0.3s ease;
    align-self: flex-start;
  }

  #printBtn:hover {
    background: #1e3c72;
  }
</style>
</head>
